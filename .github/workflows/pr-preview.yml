name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment setup instructions
        if: steps.creds.outputs.configured != 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            ## Превью страницы

            Для этого репозитория ещё не настроены секреты Cloudflare, поэтому ссылка не создалась.

            Разовая настройка (бесплатно):
            1. Зарегистрируйтесь на [Cloudflare](https://dash.cloudflare.com/sign-up)
            2. Account ID: справа на главной дашборда
            3. API token: [Create Token](https://dash.cloudflare.com/profile/api-tokens) → шаблон **Edit Cloudflare Pages**
            4. В GitHub: **Settings → Secrets and variables → Actions** добавьте:
               - `CLOUDFLARE_API_TOKEN`
               - `CLOUDFLARE_ACCOUNT_ID`

            После этого запушьте новый коммит в этот PR — здесь появится ссылка на превью.
            Боевой сайт `maslianski.by` не меняется.

      - name: Checkout
        if: steps.creds.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.creds.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.configured == 'true'
        run: npm ci

      - name: Build
        if: steps.creds.outputs.configured == 'true'
        run: npm run build
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_DOCTOR_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_DOCTOR_TEMPLATE_ID }}
          VITE_EMAILJS_PATIENT_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_PATIENT_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_NOTIFICATION_EMAIL: ${{ secrets.VITE_NOTIFICATION_EMAIL }}
          VITE_INSTAGRAM_URL: ${{ secrets.VITE_INSTAGRAM_URL }}
          VITE_TELEGRAM_URL: ${{ secrets.VITE_TELEGRAM_URL }}

      - name: Prepare preview files
        if: steps.creds.outputs.configured == 'true'
        run: |
          rm -f dist/CNAME
          find dist -name '*.html' -print0 | xargs -0 sed -i 's/index, follow/noindex, nofollow/g'
          printf '%s\n' '/* /index.html 200' > dist/_redirects

      - name: Deploy preview
        if: steps.creds.outputs.configured == 'true'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 whoami
          npx --yes wrangler@4 pages project create maslianski-website-preview --production-branch=main || true
          npx --yes wrangler@4 pages deploy dist \
            --project-name=maslianski-website-preview \
            --branch=pr-${{ github.event.number }} \
            --commit-dirty=true \
            | tee deploy.log
          alias_url="$(grep -Eo 'https://pr-[^[:space:]]+\.pages\.dev' deploy.log | tail -1 || true)"
          deploy_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' deploy.log | tail -1 || true)"
          preview_url="${alias_url:-$deploy_url}"
          if [ -z "$preview_url" ]; then
            echo "Could not parse preview URL from Wrangler output" >&2
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $preview_url"

      - name: Comment preview URL
        if: steps.creds.outputs.configured == 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            ## Превью страницы

            Откройте с телефона или компьютера (боевой сайт не затронут):

            **${{ steps.deploy.outputs.preview_url }}**

            Ссылка обновляется при каждом новом коммите в этот PR.

  cleanup-comment:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            ## Превью страницы

            PR закрыт. Превью больше не обновляется. Если изменения смержены, они будут на [maslianski.by](https://maslianski.by/) после деплоя `main`.
